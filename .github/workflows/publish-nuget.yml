name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Reconcilr.slnx

      - name: Run smoke tests
        run: dotnet run --project Reconcilr.SmokeTests/Reconcilr.SmokeTests.csproj --configuration Release --no-restore

      - name: Set package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack packages
        run: |
          dotnet pack Reconcilr.Core/Reconcilr.Core.csproj --configuration Release --no-restore --output artifacts /p:PackageVersion=${{ steps.version.outputs.package_version }}
          dotnet pack Reconcilr.Generator/Reconcilr.Generator.csproj --configuration Release --no-restore --output artifacts /p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: flavourous

      - name: Publish packages
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate